services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env

  pagos_flask:
    build: ./microservicio_pagos
    restart: unless-stopped
    ports:
      - "5000:5000"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - pagos_flask
